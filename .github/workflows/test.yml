name: Tests

on:
  push:
    branches: master

jobs:
  test:
    name: Vitest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor
            project: editor
            workers: 2
            shard: 1/1
          - name: caliburn 1/8
            project: caliburn
            workers: 1
            shard: 1/8
          - name: caliburn 2/8
            project: caliburn
            workers: 1
            shard: 2/8
          - name: caliburn 3/8
            project: caliburn
            workers: 1
            shard: 3/8
          - name: caliburn 4/8
            project: caliburn
            workers: 1
            shard: 4/8
          - name: caliburn 5/8
            project: caliburn
            workers: 1
            shard: 5/8
          - name: caliburn 6/8
            project: caliburn
            workers: 1
            shard: 6/8
          - name: caliburn 7/8
            project: caliburn
            workers: 1
            shard: 7/8
          - name: caliburn 8/8
            project: caliburn
            workers: 1
            shard: 8/8
          - name: caliburn-app
            project: caliburn-app
            workers: 2
            shard: 1/1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Install and test
        run: |
          yarn install
          yarn vitest run --project "${{ matrix.project }}" --maxWorkers=${{ matrix.workers }} --shard=${{ matrix.shard }}
