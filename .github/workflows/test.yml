name: Tests

on:
  push:
    branches: master

jobs:
  test:
    name: Vitest (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - editor
          - caliburn
          - caliburn-app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Install and test
        run: |
          yarn install
          yarn vitest run --project "${{ matrix.project }}" --maxWorkers=2
