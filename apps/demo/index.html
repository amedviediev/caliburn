<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caliburn</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      demo-root {
        display: block;
        height: 100%;
      }
      caliburn-editor {
        display: block;
        height: 100%;
      }
      .App-toolbar {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        gap: 4px;
        padding: 6px;
        background: var(--island-bg-color, #fff);
        border-radius: 8px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.12);
      }
      .App-toolbar button {
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 6px 8px;
        font: 12px/1 system-ui, sans-serif;
        color: #333;
        cursor: pointer;
      }
      .App-toolbar button:hover {
        background: #f1f0ff;
      }
    </style>
  </head>
  <body>
    <demo-root></demo-root>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
