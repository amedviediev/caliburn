<caliburn-dialog
  [class]="dialogClass()"
  size="small"
  [title]="title()"
  [fullscreen]="isMobile"
  (closeRequest)="cancel.emit()"
>
  <ng-content />
  <div class="confirm-dialog-buttons">
    <button
      caliburn-dialog-action-button
      [label]="cancelLabel()"
      (select)="handleCancel()"
    ></button>
    <button
      caliburn-dialog-action-button
      [label]="confirmLabel()"
      actionType="danger"
      (select)="handleConfirm()"
    ></button>
  </div>
</caliburn-dialog>
