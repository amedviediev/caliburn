<div
  #pickerContent
  class="color-picker-content properties-content"
  tabindex="-1"
  (keydown)="onKeyDown($event)"
>
  @if (title(); as title) {
  <div class="color-picker__title">{{ title }}</div>
  } @if (customColors().length) {
  <div>
    <div caliburn-picker-heading>{{ headings().mostUsedCustomColors }}</div>
    <div
      caliburn-custom-color-list
      [theme]="theme()"
      [colors]="customColors()"
      [color]="color()"
      [label]="headings().mostUsedCustomColors"
      (colorChange)="colorChange.emit($event)"
    ></div>
  </div>
  }
  <div>
    <div caliburn-picker-heading>{{ headings().colors }}</div>
    <div
      caliburn-picker-color-list
      [theme]="theme()"
      [color]="color()"
      [palette]="palette()"
      [activeShade]="activeShade()"
      [showHotKey]="showHotKey()"
      [excludedColors]="excludedColors()"
      (colorChange)="colorChange.emit($event)"
    ></div>
  </div>
  <div>
    <div caliburn-picker-heading>{{ headings().shades }}</div>
    <div
      caliburn-shade-list
      [theme]="theme()"
      [color]="color()"
      [palette]="palette()"
      [showHotKey]="showHotKey()"
      (colorChange)="colorChange.emit($event)"
    ></div>
  </div>
  <ng-content />
</div>
