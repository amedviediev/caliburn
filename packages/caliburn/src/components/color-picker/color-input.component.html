<div class="color-picker__input-label-container">
  <div class="color-picker__input-label" [class.has-error]="!!errorMessage()">
    <div class="color-picker__input-hash">#</div>
    <input
      #colorInput
      style="border: 0; padding: 0"
      spellcheck="false"
      class="color-picker-input"
      tabindex="-1"
      [attr.aria-label]="label()"
      [attr.aria-invalid]="!!errorMessage()"
      [attr.placeholder]="placeholder() ?? null"
      [value]="displayValue()"
      (input)="onInput($event)"
      (change)="onInput($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
      (keydown)="onKeyDown($event)"
    />
    @if (showEyeDropper()) {
    <div
      style="
        width: 1px;
        height: 1.25rem;
        background-color: var(--default-border-color);
      "
    ></div>
    <div
      #eyeDropperTrigger
      class="excalidraw-eye-dropper-trigger"
      [class.selected]="isEyeDropperActive()"
      [attr.title]="eyeDropperTitle()"
      (click)="toggleEyeDropper()"
    >
      <ng-icon name="eyeDropperIcon" />
    </div>
    }
  </div>
  @if (errorMessage(); as errorMessage) {
  <div class="color-picker__error-message" role="alert">{{ errorMessage }}</div>
  }
</div>
