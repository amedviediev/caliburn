<caliburn-modal
  [class]="modalClass()"
  [class.Dialog--fullscreen]="fullscreen()"
  [maxWidth]="dialogSize()"
  labelledBy="dialog-title"
  [closeOnClickOutside]="closeOnClickOutside()"
  (closeRequest)="onClose()"
>
  <caliburn-island>
    @if (titleTemplate() || title()) {
      <h2 [id]="titleId" class="Dialog__title">
        @if (titleTemplate(); as template) {
          <span class="Dialog__titleContent">
            <ng-container *ngTemplateOutlet="template" />
          </span>
        } @else {
          <span class="Dialog__titleContent">{{ title() }}</span>
        }
      </h2>
    }
    @if (fullscreen()) {
      <button
        class="Dialog__close"
        (click)="onClose()"
        [title]="closeLabel()"
        [attr.aria-label]="closeLabel()"
        type="button"
      >
        <ng-icon name="closeIcon" />
      </button>
    }
    <div class="Dialog__content"><ng-content /></div>
  </caliburn-island>
</caliburn-modal>
